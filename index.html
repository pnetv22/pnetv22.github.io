<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBO Player Web - Xtream & M3U</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background: radial-gradient(circle at top right, #1e1b4b, #090a0f 70%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .ibo-card {
      transition: all 0.22s ease;
      background: linear-gradient(145deg, rgba(30,41,59,0.88), rgba(15,23,42,0.96));
      border: 1px solid rgba(255,255,255,0.08);
    }
    .ibo-card:hover {
      transform: translateY(-4px) scale(1.015);
      border-color: #6366f1;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOPBAR -->
  <header class="flex flex-wrap items-center justify-between px-6 py-4 bg-slate-950/85 backdrop-blur-md border-b border-white/10 sticky top-0 z-30 gap-3">
    <div class="flex items-center gap-3 cursor-pointer" onclick="showDashboard()">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-play text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-wide">9XTREAM / IBO WEB</h1>
        <p id="statusHeader" class="text-xs text-emerald-400">Pronto para conectar</p>
      </div>
    </div>

    <!-- Barra de Pesquisa -->
    <div id="searchContainer" class="hidden flex-1 max-w-md mx-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="Pesquisar nome do canal, filme ou série..."
          oninput="renderGrid()"
          class="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-900 border border-white/10 text-sm focus:outline-none focus:border-indigo-500"
        />
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openLoginModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs sm:text-sm font-semibold flex items-center gap-2 transition">
        <i class="fa-solid fa-plug"></i> Configurar Link M3U
      </button>
    </div>
  </header>

  <!-- DASHBOARD ESTILO IBO PLAYER / VU PLAYER PRO -->
  <main id="dashboardView" class="flex-1 flex flex-col justify-center items-center p-6">
    <div class="max-w-5xl w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      
      <div onclick="openSection('live')" class="ibo-card rounded-2xl p-6 cursor-pointer flex flex-col justify-between h-56 relative overflow-hidden group">
        <div class="w-14 h-14 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 text-2xl">
          <i class="fa-solid fa-satellite-dish"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold">TV Ao Vivo</h2>
          <p class="text-xs text-slate-400 mt-1">Canais em tempo real</p>
        </div>
        <i class="fa-solid fa-tv absolute -right-4 -bottom-4 text-8xl text-white/5 group-hover:text-rose-500/15 transition"></i>
      </div>

      <div onclick="openSection('vod')" class="ibo-card rounded-2xl p-6 cursor-pointer flex flex-col justify-between h-56 relative overflow-hidden group">
        <div class="w-14 h-14 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-2xl">
          <i class="fa-solid fa-film"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold">Filmes</h2>
          <p class="text-xs text-slate-400 mt-1">Catálogo Cinema & VOD</p>
        </div>
        <i class="fa-solid fa-clapperboard absolute -right-4 -bottom-4 text-8xl text-white/5 group-hover:text-amber-500/15 transition"></i>
      </div>

      <div onclick="openSection('series')" class="ibo-card rounded-2xl p-6 cursor-pointer flex flex-col justify-between h-56 relative overflow-hidden group">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-2xl">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold">Séries</h2>
          <p class="text-xs text-slate-400 mt-1">Temporadas e Episódios</p>
        </div>
        <i class="fa-solid fa-photo-film absolute -right-4 -bottom-4 text-8xl text-white/5 group-hover:text-emerald-500/15 transition"></i>
      </div>

      <div onclick="openSection('offline')" class="ibo-card rounded-2xl p-6 cursor-pointer flex flex-col justify-between h-56 relative overflow-hidden group">
        <div class="w-14 h-14 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-2xl">
          <i class="fa-solid fa-cloud-arrow-down"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold">Meus Offline</h2>
          <p id="offlineCounter" class="text-xs text-indigo-300 mt-1">0 salvos no navegador</p>
        </div>
        <i class="fa-solid fa-hard-drive absolute -right-4 -bottom-4 text-8xl text-white/5 group-hover:text-indigo-500/15 transition"></i>
      </div>

    </div>
  </main>

  <!-- VISÃO DE CATÁLOGO (CATEGORIAS + CONTEÚDO) -->
  <section id="catalogView" class="hidden flex-1 flex flex-col md:flex-row overflow-hidden h-[calc(100vh-73px)]">
    <!-- Lateral de Categorias -->
    <aside class="w-full md:w-64 bg-slate-950/90 border-b md:border-b-0 md:border-r border-white/10 flex flex-col max-h-48 md:max-h-full">
      <div class="p-3.5 border-b border-white/10 flex items-center justify-between">
        <button onclick="showDashboard()" class="text-xs sm:text-sm text-slate-300 hover:text-white flex items-center gap-2 font-semibold">
          <i class="fa-solid fa-arrow-left"></i> Menu Inicial
        </button>
        <span id="sectionBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-indigo-600 font-bold uppercase"></span>
      </div>
      <div id="categoryList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </aside>

    <!-- Grade Principal -->
    <div class="flex-1 overflow-y-auto p-5">
      <div id="loadingCatalog" class="hidden text-center py-20 text-indigo-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
        <p class="text-sm">Carregando catálogo do servidor...</p>
      </div>
      <div id="itemsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
    </div>
  </section>

  <!-- MODAL DE EPISÓDIOS DE SÉRIES -->
  <div id="seriesModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-40">
    <div class="bg-slate-900 border border-white/15 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-white/10 flex items-center justify-between">
        <h3 id="seriesModalTitle" class="text-lg font-bold truncate">Episódios da Série</h3>
        <button onclick="closeSeriesModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="seriesEpisodesList" class="p-4 overflow-y-auto space-y-2 flex-1"></div>
    </div>
  </div>

  <!-- MODAL DE CONFIGURAÇÃO DO LINK M3U -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-white/15 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold">Conectar Lista M3U / Xtream</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Seu Link M3U Completo</label>
      <input
        id="m3uLinkInput"
        type="text"
        value="http://tvs.shamol.site/get.php?username=23260844&password=K788b7577m&type=m3u_plus&output=ts"
        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-white/15 text-xs sm:text-sm mb-4 focus:outline-none focus:border-indigo-500"
      />

      <div class="flex items-center gap-2 mb-5">
        <input type="checkbox" id="corsProxyCheck" class="rounded bg-slate-950" />
        <label for="corsProxyCheck" class="text-xs text-slate-300">
          Ativar Proxy CORS (Marque se o navegador bloquear a listagem de canais)
        </label>
      </div>

      <div class="flex justify-end gap-3">
        <button onclick="closeLoginModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs sm:text-sm">Fechar</button>
        <button onclick="saveAndParseCredentials()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs sm:text-sm font-semibold">
          Salvar e Conectar
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DO PLAYER DE VÍDEO -->
  <div id="playerModal" class="hidden fixed inset-0 bg-black/95 flex flex-col justify-center items-center p-4 z-50">
    <div class="w-full max-w-5xl flex flex-wrap items-center justify-between gap-2 mb-3">
      <div>
        <h3 id="playerTitle" class="text-base sm:text-lg font-bold">Reproduzindo</h3>
        <p id="playerSubtitle" class="text-xs text-slate-400"></p>
      </div>
      <div class="flex items-center gap-2">
        <!-- Botão de Baixar p/ Offline Interno -->
        <button id="btnDownloadOffline" onclick="downloadCurrentForOffline()" class="hidden px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold flex items-center gap-2 transition">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <span id="downloadBtnText">Baixar p/ Assistir Offline</span>
        </button>
        <button onclick="closePlayer()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-rose-600 text-xs font-semibold">
          <i class="fa-solid fa-xmark mr-1"></i> Fechar
        </button>
      </div>
    </div>

    <div class="w-full max-w-5xl bg-black rounded-2xl overflow-hidden border border-white/10 shadow-2xl aspect-video relative">
      <video id="videoPlayer" controls autoplay playsinline class="w-full h-full"></video>
    </div>
  </div>

  <script>
    // EXTRAÇÃO AUTOMÁTICA DOS DADOS DO SEU LINK M3U
    let serverConfig = {
      host: 'http://tvs.shamol.site',
      user: '23260844',
      pass: 'K788b7577m',
      useProxy: false
    };

    let currentSection = 'live'; // 'live' | 'vod' | 'series' | 'offline'
    let categoriesCache = [];
    let streamsCache = [];
    let selectedCategoryId = 'ALL';
    let currentPlayingData = null;
    let hls = null;

    // BANCO DE DADOS INTERNO DO NAVEGADOR PARA MODO OFFLINE (IndexedDB)
    const DB_NAME = 'IBO_Xtream_OfflineDB';
    const STORE_NAME = 'offline_videos';
    let db = null;

    function initDB() {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => {
        db = e.target.result;
        updateOfflineBadge();
      };
    }
    initDB();

    function updateOfflineBadge() {
      if (!db) return;
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).count();
      req.onsuccess = () => {
        document.getElementById('offlineCounter').textContent = `${req.result} vídeo(s) salvo(s) offline`;
      };
    }

    // LER O LINK M3U E SEPARAR HOST, USUÁRIO E SENHA AUTOMATICAMENTE
    function saveAndParseCredentials() {
      const rawUrl = document.getElementById('m3uLinkInput').value.trim();
      serverConfig.useProxy = document.getElementById('corsProxyCheck').checked;

      try {
        const parsed = new URL(rawUrl);
        serverConfig.host = `${parsed.protocol}//${parsed.host}`;
        serverConfig.user = parsed.searchParams.get('username') || '';
        serverConfig.pass = parsed.searchParams.get('password') || '';

        document.getElementById('statusHeader').textContent = `Conectado: ${serverConfig.user} (${parsed.host})`;
        closeLoginModal();
      } catch (e) {
        alert('Formato de link inválido. Verifique se começa com http://');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      saveAndParseCredentials();
    });

    function openLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }
    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('catalogView').classList.add('hidden');
      document.getElementById('searchContainer').classList.add('hidden');
    }

    function buildApiUrl(action, extraParams = '') {
      const raw = `${serverConfig.host}/player_api.php?username=${serverConfig.user}&password=${serverConfig.pass}&action=${action}${extraParams}`;
      return serverConfig.useProxy ? `https://corsproxy.io/?${encodeURIComponent(raw)}` : raw;
    }

    // ABRIR SEÇÃO (AO VIVO, FILMES, SÉRIES OU OFFLINE)
    async function openSection(section) {
      currentSection = section;
      selectedCategoryId = 'ALL';
      document.getElementById('searchInput').value = '';

      const names = { live: 'TV Ao Vivo', vod: 'Filmes', series: 'Séries', offline: 'Salvos Offline' };
      document.getElementById('sectionBadge').textContent = names[section];

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('catalogView').classList.remove('hidden');
      document.getElementById('searchContainer').classList.remove('hidden');

      if (section === 'offline') {
        renderOfflineCatalog();
        return;
      }

      const loader = document.getElementById('loadingCatalog');
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      loader.classList.remove('hidden');

      try {
        const catAction = section === 'live' ? 'get_live_categories' : section === 'vod' ? 'get_vod_categories' : 'get_series_categories';
        const streamAction = section === 'live' ? 'get_live_streams' : section === 'vod' ? 'get_vod_streams' : 'get_series';

        const [catRes, streamRes] = await Promise.all([
          fetch(buildApiUrl(catAction)),
          fetch(buildApiUrl(streamAction))
        ]);

        categoriesCache = await catRes.json();
        streamsCache = await streamRes.json();

        renderCategoriesSidebar();
        renderGrid();
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-400">
            <p class="font-bold text-base mb-2">Erro ao comunicar com o servidor (${serverConfig.host}).</p>
            <p class="text-xs text-slate-300 max-w-lg mx-auto mb-4">
              Dica: Clique em "Configurar Link M3U" no topo e marque a opção "Ativar Proxy CORS", ou certifique-se de abrir o arquivo index.html diretamente pelo navegador sem bloqueio HTTPS.
            </p>
          </div>`;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function renderCategoriesSidebar() {
      const container = document.getElementById('categoryList');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition ${
        selectedCategoryId === 'ALL' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'
      }`;
      allBtn.textContent = `TODOS (${streamsCache.length})`;
      allBtn.onclick = () => {
        selectedCategoryId = 'ALL';
        renderCategoriesSidebar();
        renderGrid();
      };
      container.appendChild(allBtn);

      categoriesCache.forEach(cat => {
        const btn = document.createElement('button');
        const active = selectedCategoryId === String(cat.category_id);
        btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-medium truncate transition ${
          active ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'
        }`;
        btn.textContent = cat.category_name;
        btn.onclick = () => {
          selectedCategoryId = String(cat.category_id);
          renderCategoriesSidebar();
          renderGrid();
        };
        container.appendChild(btn);
      });
    }

    function renderGrid() {
      if (currentSection === 'offline') {
        renderOfflineCatalog();
        return;
      }

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      let list = streamsCache;

      if (selectedCategoryId !== 'ALL') {
        list = list.filter(item => String(item.category_id) === selectedCategoryId);
      }
      if (query) {
        list = list.filter(item => (item.name || item.title || '').toLowerCase().includes(query));
      }

      const displayList = list.slice(0, 150); // Renderiza os 150 primeiros para manter alta velocidade
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      if (displayList.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Nenhum resultado encontrado.</p>`;
        return;
      }

      displayList.forEach(item => {
        const title = item.name || item.title || 'Sem título';
        const icon = item.stream_icon || item.cover || '';
        const card = document.createElement('div');
        card.className = 'ibo-card rounded-xl overflow-hidden cursor-pointer flex flex-col justify-between';

        card.onclick = () => {
          if (currentSection === 'live') {
            // Converte automaticamente de .ts para .m3u8 para tocar no navegador
            const liveUrl = `${serverConfig.host}/live/${serverConfig.user}/${serverConfig.pass}/${item.stream_id}.m3u8`;
            openVideoPlayer({
              id: `live_${item.stream_id}`,
              title: title,
              subtitle: 'Canal Ao Vivo',
              url: liveUrl,
              type: 'live',
              cover: icon
            });
          } else if (currentSection === 'vod') {
            const ext = item.container_extension || 'mp4';
            const movieUrl = `${serverConfig.host}/movie/${serverConfig.user}/${serverConfig.pass}/${item.stream_id}.${ext}`;
            openVideoPlayer({
              id: `vod_${item.stream_id}`,
              title: title,
              subtitle: `Filme (${ext.toUpperCase()})`,
              url: movieUrl,
              type: 'vod',
              cover: icon
            });
          } else if (currentSection === 'series') {
            openSeriesEpisodes(item.series_id, title, icon);
          }
        };

        card.innerHTML = `
          ${icon
            ? `<img src="${icon}" alt="${title}" loading="lazy" onerror="this.style.display='none'" class="w-full h-44 object-cover bg-slate-900" />`
            : `<div class="w-full h-44 bg-slate-900 flex items-center justify-center text-slate-600 text-3xl"><i class="fa-solid fa-play"></i></div>`
          }
          <div class="p-3">
            <h4 class="text-xs font-semibold line-clamp-2">${title}</h4>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // LISTAR TEMPORADAS E EPISÓDIOS DA SÉRIE
    async function openSeriesEpisodes(seriesId, seriesTitle, cover) {
      const modal = document.getElementById('seriesModal');
      const container = document.getElementById('seriesEpisodesList');
      document.getElementById('seriesModalTitle').textContent = seriesTitle;
      container.innerHTML = `<p class="text-center py-8 text-indigo-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando episódios...</p>`;
      modal.classList.remove('hidden');

      try {
        const res = await fetch(buildApiUrl('get_series_info', `&series_id=${seriesId}`));
        const data = await res.json();
        container.innerHTML = '';

        const episodesBySeason = data.episodes || {};
        const seasons = Object.keys(episodesBySeason);

        if (seasons.length === 0) {
          container.innerHTML = `<p class="text-center text-slate-400 py-6">Nenhum episódio disponível.</p>`;
          return;
        }

        seasons.forEach(seasonNum => {
          const seasonHeader = document.createElement('div');
          seasonHeader.className = 'text-xs font-bold uppercase text-indigo-400 pt-3 pb-1 border-b border-white/10';
          seasonHeader.textContent = `Temporada ${seasonNum}`;
          container.appendChild(seasonHeader);

          episodesBySeason[seasonNum].forEach(ep => {
            const ext = ep.container_extension || 'mp4';
            const epUrl = `${serverConfig.host}/series/${serverConfig.user}/${serverConfig.pass}/${ep.id}.${ext}`;
            const epRow = document.createElement('div');
            epRow.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-950/70 hover:bg-slate-800 cursor-pointer transition';
            epRow.innerHTML = `
              <span class="text-xs font-medium">Ep. ${ep.episode_num} - ${ep.title || 'Episódio ' + ep.episode_num}</span>
              <span class="text-xs text-indigo-400 font-semibold"><i class="fa-solid fa-play mr-1"></i> Assistir</span>
            `;
            epRow.onclick = () => {
              closeSeriesModal();
              openVideoPlayer({
                id: `series_${ep.id}`,
                title: `${seriesTitle} - S${seasonNum}E${ep.episode_num}`,
                subtitle: ep.title || '',
                url: epUrl,
                type: 'series',
                cover: cover
              });
            };
            container.appendChild(epRow);
          });
        });
      } catch (e) {
        container.innerHTML = `<p class="text-center text-rose-400 py-6">Erro ao carregar temporadas.</p>`;
      }
    }

    function closeSeriesModal() {
      document.getElementById('seriesModal').classList.add('hidden');
    }

    // REPRODUTOR DE VÍDEO E DOWNLOAD OFFLINE INTERNO
    function openVideoPlayer(item, isOfflineBlob = false) {
      currentPlayingData = item;
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      const dlBtn = document.getElementById('btnDownloadOffline');

      document.getElementById('playerTitle').textContent = item.title;
      document.getElementById('playerSubtitle').textContent = item.subtitle || '';
      modal.classList.remove('hidden');

      if ((item.type === 'vod' || item.type === 'series') && !isOfflineBlob) {
        dlBtn.classList.remove('hidden');
        document.getElementById('downloadBtnText').textContent = 'Baixar p/ Assistir Offline';
      } else {
        dlBtn.classList.add('hidden');
      }

      if (hls) {
        hls.destroy();
        hls = null;
      }

      const playUrl = isOfflineBlob ? URL.createObjectURL(item.blob) : item.url;

      if (!isOfflineBlob && playUrl.includes('.m3u8') && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(playUrl);
        hls.attachMedia(video);
      } else {
        video.src = playUrl;
      }
    }

    function closePlayer() {
      const video = document.getElementById('videoPlayer');
      video.pause();
      video.src = '';
      if (hls) {
        hls.destroy();
        hls = null;
      }
      document.getElementById('playerModal').classList.add('hidden');
    }

    // BAIXAR FILME/EPISÓDIO COM PROGRESSO E GUARDAR DENTRO DO SITE (INDEXEDDB)
    async function downloadCurrentForOffline() {
      if (!currentPlayingData || !db) return;
      const btnText = document.getElementById('downloadBtnText');

      try {
        btnText.textContent = 'Iniciando download (0%)...';
        const fetchUrl = serverConfig.useProxy
          ? `https://corsproxy.io/?${encodeURIComponent(currentPlayingData.url)}`
          : currentPlayingData.url;

        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error('Servidor recusou download offline direto.');

        const contentLength = +response.headers.get('Content-Length') || 0;
        const reader = response.body.getReader();
        let receivedLength = 0;
        const chunks = [];

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          receivedLength += value.length;
          if (contentLength > 0) {
            const percent = Math.round((receivedLength / contentLength) * 100);
            btnText.textContent = `Salvando Offline (${percent}%)...`;
          } else {
            const mb = (receivedLength / (1024 * 1024)).toFixed(1);
            btnText.textContent = `Salvando Offline (${mb} MB)...`;
          }
        }

        const blob = new Blob(chunks, { type: 'video/mp4' });
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({
          id: currentPlayingData.id,
          title: currentPlayingData.title,
          subtitle: 'Salvo para assistir sem internet',
          cover: currentPlayingData.cover || '',
          blob: blob
        });

        tx.oncomplete = () => {
          btnText.textContent = 'Salvo no Modo Offline!';
          updateOfflineBadge();
        };
      } catch (e) {
        alert('Não foi possível salvar offline direto no navegador: ' + e.message);
        btnText.textContent = 'Baixar p/ Assistir Offline';
      }
    }

    function renderOfflineCatalog() {
      document.getElementById('categoryList').innerHTML = `
        <div class="p-3 text-xs text-slate-400">
          Estes filmes e episódios estão guardados na memória interna do navegador e rodam mesmo com o Wi-Fi/Dados desligados.
        </div>`;

      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      if (!db) return;
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).getAll();

      req.onsuccess = () => {
        const items = req.result;
        if (items.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Você ainda não salvou nenhum filme ou episódio para assistir offline.</p>`;
          return;
        }

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'ibo-card rounded-xl overflow-hidden flex flex-col justify-between';
          card.innerHTML = `
            <div onclick="playFromOfflineDB('${item.id}')" class="cursor-pointer">
              <div class="w-full h-40 bg-indigo-950/60 flex items-center justify-center text-indigo-400 text-3xl">
                <i class="fa-solid fa-circle-play"></i>
              </div>
              <div class="p-3">
                <h4 class="text-xs font-semibold line-clamp-2">${item.title}</h4>
                <p class="text-[10px] text-emerald-400 mt-1"><i class="fa-solid fa-bolt mr-1"></i>Pronto para ver Offline</p>
              </div>
            </div>
            <button onclick="removeOfflineItem('${item.id}')" class="w-full py-1.5 bg-rose-950/70 hover:bg-rose-600 text-[11px] text-rose-200 hover:text-white transition">
              Apagar do Offline
            </button>
          `;
          grid.appendChild(card);
        });
      };
    }

    function playFromOfflineDB(id) {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = () => {
        if (req.result) openVideoPlayer(req.result, true);
      };
    }

    function removeOfflineItem(id) {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => {
        updateOfflineBadge();
        renderOfflineCatalog();
      };
    }
  </script>

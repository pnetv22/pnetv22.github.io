<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>9XTREAM / IBO WEB PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background: radial-gradient(circle at top right, #1e1b4b, #090a0f 70%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .ibo-card {
      transition: all 0.2s ease;
      background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.98));
      border: 1px solid rgba(255,255,255,0.08);
    }
    .ibo-card:active {
      transform: scale(0.97);
      border-color: #6366f1;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOPBAR -->
  <header class="flex flex-wrap items-center justify-between px-4 py-3.5 bg-slate-950/90 backdrop-blur-md border-b border-white/10 sticky top-0 z-30 gap-3">
    <div class="flex items-center gap-3 cursor-pointer" onclick="showDashboard()">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-play text-white text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide">9XTREAM / IBO WEB</h1>
        <p id="statusHeader" class="text-[11px] text-emerald-400">Lista M3U Ativa</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openLoginModal()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-plug"></i> Trocar / Ficheiro M3U
      </button>
    </div>

    <!-- Barra de Pesquisa -->
    <div id="searchContainer" class="hidden w-full mt-1">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-slate-400 text-xs"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="Pesquisar canal, filme ou série..."
          oninput="renderGrid()"
          class="w-full pl-9 pr-4 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs focus:outline-none focus:border-indigo-500"
        />
      </div>
    </div>
  </header>

  <!-- MENU INICIAL -->
  <main id="dashboardView" class="flex-1 flex flex-col justify-center items-center p-4">
    <div class="max-w-4xl w-full grid grid-cols-2 lg:grid-cols-4 gap-4">
      
      <div onclick="openSection('live')" class="ibo-card rounded-2xl p-5 cursor-pointer flex flex-col justify-between h-44 relative overflow-hidden">
        <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 text-xl">
          <i class="fa-solid fa-satellite-dish"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">TV Ao Vivo</h2>
          <p id="badgeLive" class="text-[11px] text-slate-400">Canais Online</p>
        </div>
      </div>

      <div onclick="openSection('vod')" class="ibo-card rounded-2xl p-5 cursor-pointer flex flex-col justify-between h-44 relative overflow-hidden">
        <div class="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-xl">
          <i class="fa-solid fa-film"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">Filmes</h2>
          <p id="badgeVod" class="text-[11px] text-slate-400">Cinema & VOD</p>
        </div>
      </div>

      <div onclick="openSection('series')" class="ibo-card rounded-2xl p-5 cursor-pointer flex flex-col justify-between h-44 relative overflow-hidden">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">Séries</h2>
          <p id="badgeSeries" class="text-[11px] text-slate-400">Temporadas</p>
        </div>
      </div>

      <div onclick="openSection('offline')" class="ibo-card rounded-2xl p-5 cursor-pointer flex flex-col justify-between h-44 relative overflow-hidden">
        <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-xl">
          <i class="fa-solid fa-cloud-arrow-down"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">Offline</h2>
          <p id="offlineCounter" class="text-[11px] text-indigo-300">0 guardados</p>
        </div>
      </div>

    </div>
  </main>

  <!-- CATÁLOGO -->
  <section id="catalogView" class="hidden flex-1 flex flex-col md:flex-row overflow-hidden">
    <aside class="w-full md:w-60 bg-slate-950/90 border-b md:border-r border-white/10 flex flex-col">
      <div class="p-3 border-b border-white/10 flex items-center justify-between">
        <button onclick="showDashboard()" class="text-xs text-slate-300 flex items-center gap-1.5 font-semibold">
          <i class="fa-solid fa-arrow-left"></i> Menu Inicial
        </button>
        <span id="sectionBadge" class="text-[10px] px-2.5 py-0.5 rounded-full bg-indigo-600 font-bold uppercase"></span>
      </div>
      <div id="categoryList" class="flex md:flex-col overflow-x-auto md:overflow-y-auto p-2 gap-1.5"></div>
    </aside>

    <div class="flex-1 overflow-y-auto p-4">
      <div id="loadingCatalog" class="hidden text-center py-16 text-indigo-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
        <p class="text-xs">A carregar conteúdo...</p>
      </div>
      <div id="itemsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    </div>
  </section>

  <!-- MODAL DE CONFIGURAÇÃO + UPLOAD M3U -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-white/15 rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold">Carregar Ficheiro .M3U</h3>
        <button onclick="closeLoginModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <p class="text-[11px] text-slate-300 mb-3">
        Selecione o ficheiro <code>.m3u</code> que descarregou do seu link no Google Chrome para carregar tudo sem falhas:
      </p>

      <input
        id="localM3uFile"
        type="file"
        onchange="loadLocalM3uFile(event)"
        class="w-full text-xs text-slate-300 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white"
      />

      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeLoginModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs">Fechar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DO PLAYER -->
  <div id="playerModal" class="hidden fixed inset-0 bg-black/95 flex flex-col justify-center items-center p-3 z-50">
    <div class="w-full max-w-4xl flex flex-wrap items-center justify-between gap-2 mb-3">
      <div class="max-w-[60%]">
        <h3 id="playerTitle" class="text-sm font-bold truncate">A reproduzir</h3>
        <p id="playerSubtitle" class="text-[11px] text-slate-400 truncate"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnDownloadOffline" onclick="downloadCurrentForOffline()" class="hidden px-3 py-2 rounded-xl bg-emerald-600 text-xs font-semibold flex items-center gap-1.5">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <span id="downloadBtnText">Guardar Offline</span>
        </button>
        <button onclick="closePlayer()" class="px-3 py-2 rounded-xl bg-slate-800 text-xs font-semibold">Fechar</button>
      </div>
    </div>

    <div class="w-full max-w-4xl bg-black rounded-2xl overflow-hidden border border-white/10 aspect-video">
      <video id="videoPlayer" controls autoplay playsinline class="w-full h-full"></video>
    </div>
  </div>

  <script>
    let localM3uItems = { live: [], vod: [], series: [] };
    let currentSection = 'live';
    let categoriesCache = [];
    let streamsCache = [];
    let selectedCategoryId = 'ALL';
    let currentPlayingData = null;
    let hls = null;

    // BANCO OFFLINE (IndexedDB)
    const DB_NAME = 'IBO_V4_OfflineDB';
    const STORE_NAME = 'offline_videos';
    let db = null;

    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      updateOfflineBadge();
    };

    function updateOfflineBadge() {
      if (!db) return;
      const r = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).count();
      r.onsuccess = () => {
        document.getElementById('offlineCounter').textContent = `${r.result} guardado(s)`;
      };
    }

    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

    function showDashboard() {
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('catalogView').classList.add('hidden');
      document.getElementById('searchContainer').classList.add('hidden');
    }

    // PROCESSADOR INTELIGENTE DO FICHEIRO M3U
    async function loadLocalM3uFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const text = await file.text();
      const lines = text.split(/\r?\n/);
      localM3uItems = { live: [], vod: [], series: [] };
      let currentMeta = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const title = line.split(',').pop().trim() || 'Sem Título';
          currentMeta = {
            name: title,
            stream_icon: logoMatch ? logoMatch[1] : '',
            category_id: groupMatch && groupMatch[1] ? groupMatch[1].trim() : 'Geral'
          };
        } else if (!line.startsWith('#') && currentMeta) {
          let url = line;
          const lower = url.toLowerCase();
          
          const itemObj = {
            stream_id: i,
            name: currentMeta.name,
            stream_icon: currentMeta.stream_icon,
            category_id: currentMeta.category_id,
            direct_url: url
          };

          if (lower.includes('/series/') || /s\d{1,2}\s*e\d{1,2}/i.test(currentMeta.name)) {
            localM3uItems.series.push(itemObj);
          } else if (lower.includes('/movie/') || /\.(mp4|mkv|avi)(\?|$)/i.test(lower)) {
            localM3uItems.vod.push(itemObj);
          } else {
            // Converte automaticamente links de canais para formato HLS/m3u8 se necessário para o iPhone
            if (!url.includes('.m3u8') && url.includes(':')) {
              itemObj.direct_url = url.replace(/output=ts/g, 'output=m3u8');
            }
            localM3uItems.live.push(itemObj);
          }
          currentMeta = null;
        }
      }

      document.getElementById('statusHeader').textContent = `Lista Carregada com Sucesso!`;
      document.getElementById('badgeLive').textContent = `${localM3uItems.live.length} canais`;
      document.getElementById('badgeVod').textContent = `${localM3uItems.vod.length} filmes`;
      document.getElementById('badgeSeries').textContent = `${localM3uItems.series.length} séries`;
      closeLoginModal();
      alert(`Lista carregada! ${localM3uItems.live.length} canais e ${localM3uItems.vod.length} filmes prontos.`);
    }

    function openSection(section) {
      if (localM3uItems.live.length === 0 && localM3uItems.vod.length === 0) {
        openLoginModal();
        return;
      }

      currentSection = section;
      selectedCategoryId = 'ALL';
      document.getElementById('searchInput').value = '';

      const names = { live: 'TV Ao Vivo', vod: 'Filmes', series: 'Séries', offline: 'Offline' };
      document.getElementById('sectionBadge').textContent = names[section];

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('catalogView').classList.remove('hidden');
      document.getElementById('searchContainer').classList.remove('hidden');

      if (section === 'offline') {
        renderOfflineCatalog();
        return;
      }

      streamsCache = localM3uItems[section] || [];
      const uniqueGroups = [...new Set(streamsCache.map(i => i.category_id))];
      categoriesCache = uniqueGroups.map(g => ({ category_id: g, category_name: g }));
      renderCategoriesSidebar();
      renderGrid();
    }

    function renderCategoriesSidebar() {
      const container = document.getElementById('categoryList');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `shrink-0 px-3 py-2 rounded-xl text-xs font-semibold ${
        selectedCategoryId === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-300'
      }`;
      allBtn.textContent = `TODOS (${streamsCache.length})`;
      allBtn.onclick = () => {
        selectedCategoryId = 'ALL';
        renderCategoriesSidebar();
        renderGrid();
      };
      container.appendChild(allBtn);

      categoriesCache.forEach(cat => {
        const btn = document.createElement('button');
        const active = selectedCategoryId === String(cat.category_id);
        btn.className = `shrink-0 md:w-full text-left px-3 py-2 rounded-xl text-xs font-medium truncate ${
          active ? 'bg-indigo-600 text-white' : 'bg-slate-900/60 text-slate-300'
        }`;
        btn.textContent = cat.category_name;
        btn.onclick = () => {
          selectedCategoryId = String(cat.category_id);
          renderCategoriesSidebar();
          renderGrid();
        };
        container.appendChild(btn);
      });
    }

    function renderGrid() {
      if (currentSection === 'offline') {
        renderOfflineCatalog();
        return;
      }

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      let list = streamsCache;

      if (selectedCategoryId !== 'ALL') {
        list = list.filter(item => String(item.category_id) === selectedCategoryId);
      }
      if (query) {
        list = list.filter(item => (item.name || '').toLowerCase().includes(query));
      }

      const displayList = list.slice(0, 120);
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      if (displayList.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10 text-xs">Nenhum resultado encontrado.</p>`;
        return;
      }

      displayList.forEach(item => {
        const title = item.name || 'Sem título';
        const icon = item.stream_icon || '';
        const card = document.createElement('div');
        card.className = 'ibo-card rounded-xl overflow-hidden cursor-pointer flex flex-col justify-between';

        card.onclick = () => {
          openVideoPlayer({
            id: `item_${item.stream_id}`,
            title: title,
            subtitle: String(item.category_id),
            url: item.direct_url,
            type: currentSection,
            cover: icon
          });
        };

        card.innerHTML = `
          ${icon
            ? `<img src="${icon}" alt="${title}" loading="lazy" onerror="this.style.display='none'" class="w-full h-36 object-cover bg-slate-900" />`
            : `<div class="w-full h-36 bg-slate-900 flex items-center justify-center text-slate-600 text-2xl"><i class="fa-solid fa-play"></i></div>`
          }
          <div class="p-2.5">
            <h4 class="text-xs font-semibold line-clamp-2">${title}</h4>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideoPlayer(item, isOfflineBlob = false) {
      currentPlayingData = item;
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      const dlBtn = document.getElementById('btnDownloadOffline');

      document.getElementById('playerTitle').textContent = item.title;
      document.getElementById('playerSubtitle').textContent = item.subtitle || '';
      modal.classList.remove('hidden');

      if ((item.type === 'vod' || item.type === 'series') && !isOfflineBlob) {
        dlBtn.classList.remove('hidden');
        document.getElementById('downloadBtnText').textContent = 'Guardar Offline';
      } else {
        dlBtn.classList.add('hidden');
      }

      if (hls) { hls.destroy(); hls = null; }
      const playUrl = isOfflineBlob ? URL.createObjectURL(item.blob) : item.url;

      if (!isOfflineBlob && playUrl.includes('.m3u8') && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(playUrl);
        hls.attachMedia(video);
      } else {
        video.src = playUrl;
      }
    }

    function closePlayer() {
      const video = document.getElementById('videoPlayer');
      video.pause();
      video.src = '';
      if (hls) { hls.destroy(); hls = null; }
      document.getElementById('playerModal').classList.add('hidden');
    }

    // SALVAMENTO OFFLINE SEGURO PARA O IPHONE
    async function downloadCurrentForOffline() {
      if (!currentPlayingData || !db) return;
      const btnText = document.getElementById('downloadBtnText');
      try {
        btnText.textContent = 'A descarregar para o telemóvel...';
        const response = await fetch(currentPlayingData.url, { mode: 'cors' });
        if (!response.ok) throw new Error('Bloqueio do servidor');
        
        const blob = await response.blob();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({
          id: currentPlayingData.id,
          title: currentPlayingData.title,
          subtitle: 'Disponível Offline',
          blob: blob
        });
        tx.oncomplete = () => {
          btnText.textContent = 'Guardado Offline com Sucesso!';
          updateOfflineBadge();
        };
      } catch (e) {
        // Fallback inteligente para servidores restritos de IPTV
        alert('Este servidor protege o link direto. Dica: Pode abrir o filme e utilizar o leitor nativo do iOS para reproduzir sem interrupções.');
        btnText.textContent = 'Guardar Offline';
      }
    }

    function renderOfflineCatalog() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      if (!db) return;
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
      req.onsuccess = () => {
        const items = req.result;
        if (items.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10 text-xs">Nenhum vídeo guardado offline no navegador.</p>`;
          return;
        }
        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'ibo-card rounded-xl overflow-hidden flex flex-col justify-between p-3';
          card.innerHTML = `
            <div onclick="playFromOfflineDB('${item.id}')" class="cursor-pointer mb-2">
              <h4 class="text-xs font-bold">${item.title}</h4>
              <p class="text-[10px] text-emerald-400 mt-1">Pronto para ver sem internet</p>
            </div>
            <button onclick="removeOfflineItem('${item.id}')" class="w-full py-1 bg-rose-900/60 rounded text-[10px]">Apagar</button>
          `;
          grid.appendChild(card);
        });
      };
    }

    function playFromOfflineDB(id) {
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(id);
      req.onsuccess = () => { if (req.result) openVideoPlayer(req.result, true); };
    }

    function removeOfflineItem(id) {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => { updateOfflineBadge(); renderOfflineCatalog(); };
    }
  </script>
</body>
</html>
